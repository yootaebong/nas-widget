# 사용법: cp config.example.toml config.toml 로 채운 뒤 `docker compose up -d`
# 위젯 상태 주소: http://<이 서버 IP>:8080/status
services:
  nas-widget-server:
    build: .
    ports:
      - "8080:8080"
    volumes:
      - ./config.toml:/config/config.toml:ro
    # 비밀값을 파일 대신 환경 변수로 넣으려면 주석을 풀고 .env 에 적으세요.
    # environment:
    #   TOKEN: ${TOKEN}
    #   BESZEL_PASSWORD: ${BESZEL_PASSWORD}
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

  # Beszel 허브(선택). 이미 Beszel 허브가 있다면 이 서비스를 지우고
  # config.toml 의 [beszel] url 을 그 주소로 바꾸세요.
  # 각 기기에는 Beszel 에이전트를 따로 설치합니다(허브 화면의 "시스템 추가" 안내 참고).
  beszel:
    image: henrygd/beszel:latest
    ports:
      # 처음 들어온 사람이 관리자 계정을 만들므로 이 기기에서만 열어 둡니다.
      # 다른 기기에서 열려면 127.0.0.1 을 이 서버의 내부망·Tailscale IP 로 바꾸세요.
      - "127.0.0.1:8090:8090"
    volumes:
      - ./beszel_data:/beszel_data
    restart: unless-stopped
