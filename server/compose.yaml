# 사용법: cp config.example.toml config.toml · cp .env.example .env 로 채운 뒤 `docker compose up -d`
# 위젯 상태 주소: http://<LISTEN_IP>:8080/status
services:
  nas-widget-server:
    build: .
    ports:
      # 도커는 방화벽(ufw 등)을 우회해 포트를 열므로 모든 네트워크(0.0.0.0)에 열지 않는다.
      # .env 의 LISTEN_IP(보통 이 서버의 집 안 IP)에만 연다.
      - "${LISTEN_IP:?.env 에 LISTEN_IP(이 서버의 집 안 IP)를 넣으세요}:8080:8080"
    volumes:
      - ./config.toml:/config/config.toml:ro
    # 비밀값을 파일 대신 환경 변수로 넣으려면 주석을 풀고 .env 에 적으세요.
    # environment:
    #   TOKEN: ${TOKEN}
    #   BESZEL_PASSWORD: ${BESZEL_PASSWORD}
    #   GRAFANA_PASSWORD: ${GRAFANA_PASSWORD}
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

  # Beszel 허브(선택). 이미 Beszel 허브가 있다면 이 서비스를 지우고
  # config.toml 의 [beszel] url 을 그 주소로 바꾸세요.
  # 각 기기에는 Beszel 에이전트를 따로 설치합니다(허브 화면의 "시스템 추가" 안내 참고).
  beszel:
    image: henrygd/beszel:0.21.1
    ports:
      # 처음 들어온 사람이 관리자 계정을 만들므로 기본은 이 기기에서만 엽니다.
      # 계정을 만든 뒤 윈도우·휴대폰 브라우저에서도 보려면 .env 의 BESZEL_LISTEN_IP 를 집 안 IP 로.
      - "${BESZEL_LISTEN_IP:-127.0.0.1}:8090:8090"
    volumes:
      - ./beszel_data:/beszel_data
    restart: unless-stopped
