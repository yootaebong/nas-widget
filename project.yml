name: NasWidget
options:
  bundleIdPrefix: io.taebong
  deploymentTarget:
    macOS: "14.0"
configFiles:
  Debug: Local.xcconfig
  Release: Local.xcconfig
settings:
  base:
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.12"
    CURRENT_PROJECT_VERSION: "13"
targets:
  NasWidget:
    type: application
    platform: macOS
    sources: [App, Shared]
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: 서버 상태 위젯
        LSUIElement: false
        NASStatusURL: $(NAS_STATUS_URL)
        NASStatusToken: $(NAS_STATUS_TOKEN)
        DashboardURL: $(DASHBOARD_URL)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSAppTransportSecurity: {NSAllowsArbitraryLoads: true}  # http 막기는 앱의 isPlainHTTPToPublic 이 한다(ATS 로컬 허용은 Tailscale 100.x 를 막음)
    entitlements:
      path: App/App.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        # 연결 시험을 통과한 설정을 위젯과 나누는 곳(Shared/SharedConfig.swift)
        com.apple.security.temporary-exception.files.home-relative-path.read-write: ["/Library/Application Support/NasWidget/"]
    dependencies:
      - target: NasWidgetExtension
  NasWidgetExtension:
    type: app-extension
    platform: macOS
    sources: [Widget, Shared]
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: 서버 상태 위젯
        NASStatusURL: $(NAS_STATUS_URL)
        NASStatusToken: $(NAS_STATUS_TOKEN)
        DashboardURL: $(DASHBOARD_URL)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSAppTransportSecurity: {NSAllowsArbitraryLoads: true}  # http 막기는 앱의 isPlainHTTPToPublic 이 한다(ATS 로컬 허용은 Tailscale 100.x 를 막음)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widget/Widget.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.temporary-exception.files.home-relative-path.read-only: ["/Library/Application Support/NasWidget/"]
